# CI for the published `express` product (github.com/alexsmn/express).
#
# express consumes no other product, so its export builds on its own: the
# export carries build-support/ at its root, and the same `ninja` / `release`
# / `test-release` presets a developer uses are all that runs here (ADR 0011).
# The `ninja` preset turns on the vcpkg `tests` feature, which is what brings
# gtest in; a consumer of express never needs it.
#
# This replaced cmake.yml on 2026-09-26, which had failed at configure on every
# leg since 2026-09-20: it downloaded CMake 3.16.2 and configured without the
# presets, and 3.16 rejects the CXX_STANDARD 23 that the shared build kit sets
# ("contained an invalid value: \"23\""). Its MinGW leg is not carried over --
# the kit's compilation contract is written for MSVC, GCC and Clang, and
# nothing in the tree builds with MinGW.
#
# There is no `continue-on-error` anywhere in this file, on purpose. A build
# job that is allowed to fail is decoration: core's matrix was exactly that
# until 2026-09-27 (superproject tasks.md 316).

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / MSVC
            os: windows-latest
          - name: Ubuntu / GCC
            os: ubuntu-latest
          - name: macOS / AppleClang
            os: macos-latest

    env:
      # A plain directory carried between runs by the restore/save steps below.
      # Not `x-gha`: vcpkg has removed that backend.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Install Ninja (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install Ninja (macOS)
      if: runner.os == 'macOS'
      run: brew install ninja

    # The presets carry no `environment` block (ADR 0011), so the MSVC
    # toolchain has to be in the environment before cmake runs. Ninja comes
    # with Visual Studio.
    - name: Set up MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    # The commit the monorepo's own vcpkg is at, the same pin the client's,
    # transport's and opcuapp's workflows carry.
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'f3e10653cc27d62a37a3763cd84b38bca07c6075'
        runVcpkgInstall: false

    - name: Create the binary cache directory
      run: cmake -E make_directory "${{ github.workspace }}/vcpkg-cache"

    - name: Restore the vcpkg binary cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}-
          vcpkg-${{ matrix.os }}-

    - name: Configure
      run: cmake --preset ninja

    - name: Build (Release)
      run: cmake --build --preset release

    # Saved even when the build fails, so the ports that did build survive.
    - name: Save the vcpkg binary cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/vcpkg-cache
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

    - name: Test (Release)
      run: ctest --preset test-release --output-on-failure --timeout 300
